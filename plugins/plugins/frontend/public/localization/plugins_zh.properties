configs.help.api-session_duration_limit = 会话最长持续时间值，以任何请求允许的秒数计算。 如果请求含有比此值高的会话持续时间，它将被限制为上限。
configs.help.api-city_data = 启用在仪表盘中跟踪城市数据。 如果禁用，将不再为用户添加或更新城市信息。
