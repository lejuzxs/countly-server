configs.help.api-trim_trailing_ending_spaces = 启用后，接收的数据会去掉开头和结尾的空白字符。
configs.help.api-event_limit = 存储在数据库中的事件密钥的最大数量。 增加此数量可能会严重影响到你的服务器性能。
configs.help.api-array_list_limit = 如果事件细分或自定义用户属性值是一个数组，其长度超过此设置所设定的最大数组长度，则只保留第一个 n 值(其中n 是最大数组长)，并丢弃任何其他值。
configs.help.api-event_segmentation_limit = 每个自定义事件的最大子属性。增加这个数值可能影响服务器性能
configs.help.api-event_segmentation_value_limit = 每个子属性值去重后最多的种类数量。增加这个值可能会影响服务性能
configs.help.api-sync_plugins = 开关插件将更新状态到具有相同数据库的所有服务器。启用将会通知到所有服务器，但是也会增加插件状检测的负载。
configs.help.api-session_cooldown = 会话结束和启动之间的时间，当服务器将扩展上一个会话而不是新
configs.help.api-total_users = 如果启用，将启用总用户API，并用于覆盖所有报表中的估计总用户数。启用将导致额外的性能开销，如果服务器压力较大请咨询Countly后决定开关。
configs.help.api-data_retention_period = 指定在删除颗粒数据( 0 表示永远不要删除它)之前保留其保存颗粒数据的长度。 此设置将只删除颗颗粒水平数据，不会影响你在概览和分析等章节中看到的汇总数据。
configs.help.api-metric_limit = 每年度不同指标值的数量。增加这个值可能影响服务器性能
configs.help.api-metric_changes = 用户总数校正要求记录更改。 如果你知道不会使用用户总数更正，请禁用它。
configs.help.api-request_threshold = 如果钻探、漏斗或其他类似的仪表盘功能请求需要过长的时间才能完成，切换到报表管理器前的时间。 这不应超过HTTP超时，默认为60秒，否则你将得不到回应。
configs.help.api-export_limit = 在单个 CSV, PDF文件中导出的文档行数数量
configs.help.api-prevent_duplicate_requests = 通过保存和比较请求hash值防止重复的请求
configs.help.api-batch_period = 进行批量处理的频度( 秒) 写到数据库
configs.help.api-batch_processing = 合并汇总数据共同撰写，并承诺使用特定频率的数据库。
configs.help.api-batch_on_master = 如果启用了，所有进程都会将数据发送到单一个进程，以便向数据库承诺。 如果你每个实例都有许多 CPU 核心，帮助你。
configs.help.api-batch_read_processing = 有些人认为，每通SDK通电话中发生的事情 都可以被隐藏起来用于重复使用
configs.help.api-batch_read_on_master = 这将共享所有的缓存读取，而不是每个进程都有自己的缓存。 如果你有多个 CPU 核心，每个实例都会帮助你。
