configs.help.tracking-self_tracking_app = 如果你想要跟踪这个服务器的使用情况和使用仪表盘的用户，请选择一个收集此数据的应用。 确保为此专门创建一个新应用，或者你会将所收集数据与已有数据合并。 数据只存储在此服务器上，而不会在其它任何地方发送。 通过选择一个应用，你将允许跟踪该服务器，并将它计为你的数据点配额。 该数据点的大小将取决于你的用户数，并经常使用这个仪表盘。
configs.help.tracking.self_tracking_url = 如果你想要向其它服务器报表自我跟踪，而不是选择一个应用，你可以提供。Countly服务器URL此处。 请确定在下面同时提供 App Key。 数据将只存储在所提供的服务器上，并且不会被发送到其它地方。 通过提供一个 App key 来。URL，你将启用此服务器的跟踪功能，该服务器将计入所提供的服务器上的数据点配额。数据点的规模将取决于你的用户数和通常使用这个仪表盘的情况。
configs.help.tracking.self_tracking_app_key = 如果你想要向其它服务器报表自我跟踪，而不是选择一个应用，你可以在此提供CountlyApp 密钥。 请确保同时提供上面的服务器URL。 数据将只存储在所提供的服务器上而不发送到其他任何地方。 通过提供一个 App Key，你将启用此服务器的追踪功能，它将会计为你所提供服务器的数据点配额。 数据库点的规模将取决于你的用户数和通常使用这个仪表盘的情况。
configs.help.tracking.self_tracking_id_policy = 你可以选择要使用哪些用户属性来识别用户。 选择 _ id 会提供更匿名的跟踪，而选择邮箱地址会允许你看到你的哪个用户最经常使用仪表盘。 没有个人数据会被收集或发送到其他任何地方，但是如果你正在使用邮箱地址，它将被存储在服务器上，并被服务器管理员可见。
