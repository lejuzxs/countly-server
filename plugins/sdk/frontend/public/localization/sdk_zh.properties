sdk.config-description-1 = 控制 SDK 是否采集数据。禁用后，SDK 停止采集新数据。只要网络通信仍然启用，已采集的数据仍会上报。
sdk.config-description-2 = 控制 SDK 是否发送网络请求。禁用后，除获取 SDK 配置外，SDK 不会发出网络请求。已启用的采集会继续，数据保存在设备上，直到达到 SDK 的存储上限。
sdk.config-description-3 = 启用或禁用未处理崩溃的自动上报。
sdk.config-description-4 = 启用或禁用页面浏览的自动记录。
sdk.config-description-5 = 向服务器发送心跳的时间间隔，单位为秒。
sdk.config-description-6 = SDK 无法连接服务器时可保留的最大请求数。
sdk.config-description-7 = SDK 批量上报之前可在队列中保留的最大事件数。
sdk.config-description-8 = 这是实验性功能，支持情况取决于 SDK 和版本。详情请查阅 SDK 文档。
